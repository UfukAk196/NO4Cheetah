[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scno"
version = "0.1.0"
description = "Neural operator replacing the space-charge Poisson solver in Cheetah"
requires-python = ">=3.10,<3.13"
# The ONLY package list of the project. New package? -> add it here, then `pip install -e ".[dev]"`.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "h5py>=3.10",
    "matplotlib>=3.8",
    "tqdm",
    # Own fork, unchanged Cheetah; locally: pip install -e "../../Cheetah repos/cheetah-accelerator"
    "cheetah-accelerator @ git+https://github.com/UfukAk196/cheetah.git",
    "neuraloperator==2.0.0",
    "ipykernel",
    "pandas",
    "wandb>=0.16",
    "optuna>=4.0",
    "pytest",
    "pytest-mock",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
