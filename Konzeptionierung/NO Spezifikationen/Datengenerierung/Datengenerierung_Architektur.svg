<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="aBlack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
    <marker id="aRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
    <marker id="aGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
    <marker id="aInherit" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L13,7 L1,13 z" fill="#fff" stroke="#222" stroke-width="1.5"/></marker>
  </defs>
  <rect width="980" height="600" fill="#fff"/>

  <!-- Titel -->
  <text x="40" y="34" font-size="22" font-weight="bold" fill="#1a3a8a">Datengenerierung</text>
  <text x="940" y="34" font-size="14" fill="#1a3a8a" text-anchor="end">05.10.2026</text>
  <line x1="40" y1="44" x2="940" y2="44" stroke="#1a3a8a" stroke-width="1"/>

  <!-- Spaltenköpfe -->
  <g font-size="15" font-weight="bold" fill="#c62828" text-anchor="middle">
    <text x="135" y="74">Klasse</text>
    <text x="410" y="74">Methode / Attribut</text>
    <text x="690" y="74">DataLoader</text>
    <text x="905" y="74">return</text>
  </g>

  <!-- Gruppe DataLoader -->
  <rect x="578" y="84" width="224" height="126" rx="6" fill="none" stroke="#999" stroke-dasharray="4 4"/>

  <!-- Boxen -->
  <g stroke="#222" stroke-width="1.6" fill="#f4f6fb">
    <rect x="40" y="110" width="190" height="60" rx="4"/>
    <rect x="40" y="260" width="190" height="60" rx="4"/>
    <rect x="320" y="110" width="180" height="60" rx="14"/>
    <rect x="320" y="260" width="180" height="60" rx="14"/>
    <rect x="590" y="94" width="200" height="44" rx="4"/>
    <rect x="590" y="156" width="200" height="44" rx="4"/>
    <rect x="590" y="268" width="200" height="44" rx="4" stroke-dasharray="5 3"/>
  </g>
  <g font-size="15" text-anchor="middle" fill="#111">
    <text x="135" y="138" font-weight="bold">CheetahDataset</text>
    <text x="135" y="157" font-size="12" fill="#666">«Child» · neu</text>
    <text x="135" y="288" font-weight="bold">PTDataset</text>
    <text x="135" y="307" font-size="12" fill="#666">«Parent» · pt_dataset.py</text>
    <text x="410" y="138" font-family="Menlo, Consolas, monospace">load_data()</text>
    <text x="410" y="157" font-size="12" fill="#666">neu</text>
    <text x="410" y="288" font-family="Menlo, Consolas, monospace">_data_processor</text>
    <text x="410" y="307" font-size="12" fill="#666">DefaultDataProcessor</text>
    <text x="690" y="121" font-family="Menlo, Consolas, monospace">train_loader</text>
    <text x="690" y="183" font-family="Menlo, Consolas, monospace">test_loader(s)</text>
    <text x="690" y="295" font-family="Menlo, Consolas, monospace" font-size="14">dataset.data_processor</text>
  </g>

  <!-- Schwarz: Aufruf / Datenfluss -->
  <g stroke="#222" stroke-width="1.6" fill="none" marker-end="url(#aBlack)">
    <line x1="230" y1="140" x2="318" y2="140"/>
    <line x1="230" y1="290" x2="318" y2="290"/>
    <line x1="500" y1="290" x2="588" y2="290"/>
    <line x1="790" y1="116" x2="896" y2="116"/>
    <line x1="790" y1="178" x2="896" y2="178"/>
    <line x1="790" y1="290" x2="896" y2="290"/>
  </g>
  <g fill="#222"><circle cx="905" cy="116" r="6"/><circle cx="905" cy="178" r="6"/><circle cx="905" cy="290" r="6"/></g>

  <!-- Vererbung -->
  <line x1="135" y1="170" x2="135" y2="259" stroke="#222" stroke-width="1.6" marker-end="url(#aInherit)"/>
  <text x="145" y="220" font-size="12" fill="#444">erbt von</text>

  <!-- Rot: instanziiert -->
  <g stroke="#c62828" stroke-width="1.6" fill="none" marker-end="url(#aRed)">
    <path d="M 410 110 C 400 82, 250 82, 205 108"/>
    <path d="M 500 132 C 540 125, 555 118, 588 116"/>
    <path d="M 500 150 C 540 160, 555 175, 588 178"/>
  </g>
  <g font-size="12" fill="#c62828" text-anchor="middle">
    <text x="290" y="84">instanziiert dataset</text>
    <text x="545" y="148">instanziiert</text>
  </g>

  <!-- Grün: Vorlagen aus neuralop -->
  <g stroke="#2e7d32" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#aGreen)">
    <path d="M 62 432 C 10 390, 10 170, 38 150"/>
    <path d="M 290 422 C 278 320, 278 210, 350 172"/>
    <path d="M 395 422 C 480 380, 560 340, 640 314"/>
    <path d="M 515 420 C 490 380, 455 350, 440 322"/>
    <path d="M 790 422 C 845 360, 845 260, 804 212"/>
  </g>
  <g stroke="#2e7d32" stroke-width="1.6" fill="#eef7ee">
    <ellipse cx="135" cy="455" rx="80" ry="30"/>
    <ellipse cx="330" cy="455" rx="98" ry="30"/>
    <ellipse cx="540" cy="455" rx="86" ry="30"/>
    <ellipse cx="760" cy="455" rx="76" ry="30"/>
  </g>
  <g font-size="13" fill="#1b5e20" text-anchor="middle" font-family="Menlo, Consolas, monospace">
    <text x="135" y="460">DarcyDataset</text>
    <text x="330" y="460" font-size="12">load_darcy_flow_small</text>
    <text x="540" y="460">data_processors.py</text>
    <text x="760" y="460">dataloader.py</text>
  </g>
  <text x="40" y="506" font-size="13" font-style="italic" fill="#2e7d32">Wie … (gem. Darcy-Flow-Bsp., neuralop)</text>

  <!-- Legende -->
  <g font-size="12" fill="#333">
    <line x1="40" y1="540" x2="80" y2="540" stroke="#222" stroke-width="1.6" marker-end="url(#aBlack)"/>
    <text x="88" y="544">Aufruf / Datenfluss</text>
    <line x1="230" y1="540" x2="270" y2="540" stroke="#c62828" stroke-width="1.6" marker-end="url(#aRed)"/>
    <text x="278" y="544">instanziiert</text>
    <line x1="380" y1="540" x2="420" y2="540" stroke="#222" stroke-width="1.6" marker-end="url(#aInherit)"/>
    <text x="428" y="544">Vererbung (Child → Parent)</text>
    <line x1="610" y1="540" x2="650" y2="540" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#aGreen)"/>
    <text x="658" y="544">Vorlage aus neuralop</text>
    <circle cx="830" cy="540" r="5" fill="#222"/>
    <text x="842" y="544">Rückgabewert</text>
  </g>
</svg>
