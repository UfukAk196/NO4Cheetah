[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scno"
version = "0.1.0"
description = "Neural Operator als Ersatz fuer den Space-Charge-Poisson-Solver in Cheetah"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.2",                    # in conda via pytorch / pytorch-gpu installieren, nicht per pip
    "numpy>=1.26",
    "scipy>=1.11",
    "h5py>=3.10",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "tqdm",
    "cheetah-accelerator==0.8.5",
    "neuraloperator==2.0.0",
]

[project.optional-dependencies]
notebooks = ["ipykernel", "pandas"]
logging = ["wandb>=0.16"]
test = ["pytest", "pytest-mock"]
dev = ["scno[notebooks,logging,test]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["src/data/tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
