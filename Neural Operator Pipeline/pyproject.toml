[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scno"
version = "0.1.0"
description = "Neural Operator als Ersatz fuer den Space-Charge-Poisson-Solver in Cheetah"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "h5py>=3.10",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
full = ["neuraloperator>=1.0", "wandb>=0.16", "hydra-core>=1.3", "einops>=0.7"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "cheetah_element",
    "evaluate",
    "train",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
