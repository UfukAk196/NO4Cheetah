# CLI-Config fuer den Datengenerator (G3, `python -m data.generate -c ...`).
#
# TODO: Die `ranges` sind Beispielwerte - durch echte Grenzen aus der
# ML-Pipeline ersetzen (siehe configs/sampling.yaml fuer die Einheiten).

seed: 0
root: data/cheetah_sc

n_train: 16
n_tests: [4, 4, 4]
train_resolution: 16
test_resolutions: [16, 32, 64]

ranges:
  # log-uniform
  sigma_x:      { min: 5.0e-6, max: 1.5e-3 }   # [m]
  sigma_y:      { min: 5.0e-6, max: 1.5e-3 }   # [m]
  sigma_tau:    { min: 1.0e-3, max: 5.0e-3 }   # [m]
  # uniform
  energy:       { min: 5.0e7,  max: 1.5e8 }    # [eV]
  total_charge: { min: 1.0e-10, max: 2.0e-9 }  # [C]
  # uniform (ganzzahlig)
  n_particles:  { min: 1.0e4,  max: 1.0e6 }    # [1]
