# Strahlparameter-Grenzen fuer den Cheetah-Space-Charge-Datengenerator (G1).
#
# TODO: Die Zahlen sind Beispielwerte. Ersetze sie durch die echten Grenzen
# aus der ML-Pipeline, bevor der volle Datensatz erzeugt wird. Dieselben
# Werte stehen (ebenfalls als TODO) im Default von
# src/cheetah_sc/sampling.py -- die Config hier hat Vorrang, sobald sie
# explizit an `sample_beam_params` bzw. `generate_cheetah_sc` uebergeben wird.
#
# Alle Angaben sind inklusive: Werte liegen in [min, max].

ranges:
  # log-uniform
  sigma_x:      { min: 5.0e-4, max: 2.0e-3 }   # [m]   horizontal (0.5 .. 2 mm)
  sigma_y:      { min: 5.0e-4, max: 2.0e-3 }   # [m]   vertikal   (0.5 .. 2 mm)
  sigma_tau:    { min: 1.0e-3, max: 8.0e-3 }   # [m]   longitudinal (1 .. 8 mm)
  # uniform
  energy:       { min: 5.0e8,  max: 2.0e9 }    # [eV]  0.5 .. 2 GeV
  total_charge: { min: 1.0e-10, max: 5.0e-9 }  # [C]   0.1 .. 5 nC
  # uniform (ganzzahlig)
  n_particles:  { min: 5.0e4,  max: 5.0e5 }    # [1]   Makropartikel pro Bunch
