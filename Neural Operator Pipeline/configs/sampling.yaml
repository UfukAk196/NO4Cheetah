# Strahlparameter-Grenzen fuer den Cheetah-Space-Charge-Datengenerator (G1).
#
# TODO: Die Zahlen sind Beispielwerte. Ersetze sie durch die echten Grenzen
# aus der ML-Pipeline, bevor der volle Datensatz erzeugt wird. Dieselben
# Werte stehen (ebenfalls als TODO) im Default von
# src/data/sampling.py -- die Config hier hat Vorrang, sobald sie
# explizit an `sample_beam_params` bzw. `generate_cheetah_sc` uebergeben wird.
#
# Alle Angaben sind inklusive: Werte liegen in [min, max].

ranges:
  # log-uniform
  sigma_x:      { min: 5.0e-6, max: 1.5e-3 }   # [m]   horizontal
  sigma_y:      { min: 5.0e-6, max: 1.5e-3 }   # [m]   vertikal
  sigma_tau:    { min: 1.0e-3, max: 5.0e-3 }   # [m]   longitudinal
  # uniform
  energy:       { min: 5.0e7,  max: 1.5e8 }    # [eV]
  total_charge: { min: 1.0e-10, max: 2.0e-9 }  # [C]
  # uniform (ganzzahlig)
  n_particles:  { min: 1.0e4,  max: 1.0e6 }    # [1]   Makropartikel pro Bunch
